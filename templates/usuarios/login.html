{% extends 'base.html' %}

{% block title %}Iniciar Sesión — FitLife{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto 0;">
    <div class="ios-card" style="padding: 2.25rem 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🏋️‍♂️</div>
            <h2 class="ios-title" style="font-size: 1.4rem;">Acceso FitLife Staff</h2>
            <p class="ios-subtitle">Ingresa tus credenciales para continuar</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Nombre de Usuario</label>
                <input type="text" name="username" id="id_username" class="ios-input" placeholder="Ej: admin.fitlife" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 1.75rem;">
                <label for="id_password">Contraseña</label>
                <input type="password" name="password" id="id_password" class="ios-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-ios-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem;">
                Ingresar al Sistema
            </button>
        </form>
    </div>
</div>
{% endblock %}
