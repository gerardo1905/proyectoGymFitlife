{% extends 'base.html' %}

{% block title %}Cambiar Contraseña — {{ trabajador.username }}{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
        <div>
            <h2 class="ios-title">Cambiar Contraseña</h2>
            <p class="ios-subtitle">Trabajador: {{ trabajador.first_name }} {{ trabajador.last_name }} ({{ trabajador.username }})</p>
        </div>
        <a href="{% url 'usuario_lista' %}" class="btn-ios-secondary">← Volver</a>
    </div>

    <form method="post" class="ios-form">
        {% csrf_token %}
        <div class="ios-card" style="padding: 1.5rem; margin-bottom: 1.5rem;">
            <div class="form-group">
                <label for="password">Nueva Contraseña</label>
                <input type="password" name="password" id="password" class="ios-input" placeholder="Mínimo 8 caracteres" required autofocus>
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem;">
            <a href="{% url 'usuario_lista' %}" class="btn-ios-secondary">Cancelar</a>
            <button type="submit" class="btn-ios-primary">Actualizar Contraseña</button>
        </div>
    </form>
</div>
{% endblock %}
