# /etc/nginx/sites-available/fitlife-backend  (EC2 BACKEND)
# Nginx recibe en el puerto 80 las solicitudes que llegan desde API Gateway
# y las pasa a Gunicorn (que solo escucha en 127.0.0.1:8000).
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 5M;
    server_tokens off;                       # no revelar la versión de Nginx

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
