# Análisis estático (SAST) con SonarQube / SonarScanner.
#   docker run -d --name sonarqube -p 9000:9000 sonarqube:community
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<TOKEN>
sonar.projectKey=fitlife_backend
sonar.projectName=FitLife Backend (Django REST Framework)
sonar.sources=.
sonar.language=py
sonar.python.version=3.10,3.11,3.12
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/migrations/**,venv/**,static/**,static_root/**,media/**,templates/**,**/__pycache__/**
sonar.tests=.
sonar.test.inclusions=**/tests.py
